name: Token Test (docasny)

# DOCASNY diagnosticky workflow, bude zmazany. Spusti Claude CLI priamo so secretom,
# bez claude-code-action, a vypise dlzku secretu a odpoved (ziadny tajny obsah).

on: workflow_dispatch

permissions:
  contents: read

jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Test token
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude --version
          echo "dlzka secretu: ${#CLAUDE_CODE_OAUTH_TOKEN}"
          claude -p "Odpovedz jednym slovom: OK" --output-format json --max-turns 1 > out.json 2> err.txt || true
          echo "--- stdout"; head -c 1500 out.json; echo
          echo "--- stderr"; head -c 800 err.txt
