name: RPO FO Sync

on:
  schedule:
    # Každú nedeľu o 4:00 UTC (= 6:00 SK letný čas)
    - cron: '0 6 * * 0'
  workflow_dispatch:
    inputs:
      since_override:
        description: 'Voliteľné: ISO timestamp odkiaľ začať sync (napr. 2026-05-01T00:00:00Z). Nechaj prázdne pre normálny beh.'
        required: false
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install psql
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Download sync state
        uses: actions/cache/restore@v4
        with:
          path: rpo_sync_state.json
          key: rpo-sync-state-${{ github.run_id }}
          restore-keys: |
            rpo-sync-state-

      - name: Run RPO FO Sync
        env:
          COCKROACH_URL: ${{ secrets.COCKROACH_URL }}
          SINCE_OVERRIDE: ${{ github.event.inputs.since_override }}
        run: |
          pip install requests
          # -X faulthandler: pri segfaulte (exit 139) vypíše traceback, kde python spadol
          python3 -X faulthandler sync_rpo_fo.py

      # Ulož postup aj keď sync zlyhal – inak by ďalší beh začal znova od nuly
      - name: Save sync state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: rpo_sync_state.json
          key: rpo-sync-state-${{ github.run_id }}

      - name: Notify Telegram on failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            -d text="⚠️ <b>RPO FO Sync zlyhal</b>%0ARepo: ${{ github.repository }}%0ALog: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"